[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "casper"
version = "0.0.1"
description = "Convert NetCDF4 to one or more CSV files"
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.12,<4"
authors = [
    { name = "Kim Cunnningham", email = "kimberly.cunningham@nasa.gov" }
]
dependencies = [
    "netcdf4>=1.6.5",
    "xarray>=2024.3.0",
    "pystac>=0.5.3",
    "importlib-metadata>=8.4.0",
    "requests>=2.32.5,<3.0.0",
    "harmony-service-lib>=2.0.0",
    "pyarrow>=15.0.0"
]

[project.urls]
Repository = "https://github.com/nasa/harmony-casper"
Documentation = "https://casper.readthedocs.io"
Changelog = "https://github.com/nasa/harmony-casper/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/nasa/harmony-casper/issues"

[project.scripts]
casper_harmony = "casper.harmony.cli:main"
casper = "casper.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "mypy>=1.9.0",
    "ruff>=0.5.0",
    "pytest-cov>=5.0.0",
    "mkdocs>=1.6.0",
    "markdown-callouts>=0.4.0",
    "markdown-include>=0.8.1",
    "mkdocstrings>=0.25.1",
    "mkdocs-jupyter>=0.24.7",
    "mkdocs-material>=9.5.22",
    "mkdocstrings-python>=1.16.12",
]
harmony = [
    "harmony-service-lib>=2.0.0"
]
integration = [
    "harmony-py>=0.4.15"
]

[[tool.mypy.overrides]]
module = "netCDF4.*"
ignore_missing_imports = true

[tool.ruff]
builtins = ["ellipsis"]
exclude = [
  ".eggs",
  "doc",
  "_typed_ops.pyi",
]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = [
    "E402",
    "E501",
    "E731",
]
select = [
  "F",
  "E",
  "W",
  "I",
  "UP",
  "B",
  "C4",
  "SIM",
]

[tool.coverage.run]
concurrency = ["multiprocessing"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:"
]

[tool.ruff.lint.isort]
known-first-party = ["casper"]